<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employees and Awards</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <style>
        /* Add any additional custom styles here */
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="mt-5">
    <h2 class="mb-3">Employees</h2>
    <p th:if="${employees.totalElements == 0}" class="alert alert-warning">No employees</p>
    <div th:unless="${employees.totalElements == 0}">
        <table class="table table-striped">
            <thead class="thead-dark">
            <tr>
                <th>First name</th>
                <th>Last name</th>
                <th>Dundie Awards</th>
                <th>Organization id</th>
                <th>Organization name</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees.content}">
                <td th:text="${employee.firstName}"></td>
                <td th:text="${employee.lastName}"></td>
                <td th:text="${employee.dundieAwards}"></td>
                <td th:text="${employee.organizationId}"></td>
                <td th:text="${employee.organizationName}"></td>
            </tr>
            </tbody>
        </table>

        <nav aria-label="Employee pages">
            <ul class="pagination">
                <li class="page-item" th:classappend="${employees.first} ? 'disabled'">
                    <span th:if="${employees.first}" class="page-link">Previous</span>
                    <a th:unless="${employees.first}" class="page-link"
                       th:href="@{/(employeePage=${employees.page - 1}, employeeSize=${employees.size},
                                   activityPage=${activities.page}, activitySize=${activities.size})}">Previous</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link"
                          th:text="'Page ' + (${employees.page} + 1) + ' of ' + ${employees.totalPages}"></span>
                </li>
                <li class="page-item" th:classappend="${employees.last} ? 'disabled'">
                    <span th:if="${employees.last}" class="page-link">Next</span>
                    <a th:unless="${employees.last}" class="page-link"
                       th:href="@{/(employeePage=${employees.page + 1}, employeeSize=${employees.size},
                                   activityPage=${activities.page}, activitySize=${activities.size})}">Next</a>
                </li>
            </ul>
        </nav>
        <p class="text-muted" th:text="${employees.totalElements} + ' employees total'"></p>
    </div>
</div>
<div class="mt-5">
    <h2 class="mb-3">Activity Log</h2>
    <p th:if="${activities.totalElements == 0}" class="alert alert-warning">No activities</p>
    <div th:unless="${activities.totalElements == 0}">
        <table class="table table-striped">
            <thead class="thead-dark">
            <tr>
                <th>Occurred At</th>
                <th>Event</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="activity : ${activities.content}">
                <td th:text="${activity.occurredAt}"></td>
                <td th:text="${activity.event}"></td>
            </tr>
            </tbody>
        </table>

        <nav aria-label="Activity log pages">
            <ul class="pagination">
                <li class="page-item" th:classappend="${activities.first} ? 'disabled'">
                    <span th:if="${activities.first}" class="page-link">Previous</span>
                    <a th:unless="${activities.first}" class="page-link"
                       th:href="@{/(activityPage=${activities.page - 1}, activitySize=${activities.size},
                                   employeePage=${employees.page}, employeeSize=${employees.size})}">Previous</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link"
                          th:text="'Page ' + (${activities.page} + 1) + ' of ' + ${activities.totalPages}"></span>
                </li>
                <li class="page-item" th:classappend="${activities.last} ? 'disabled'">
                    <span th:if="${activities.last}" class="page-link">Next</span>
                    <a th:unless="${activities.last}" class="page-link"
                       th:href="@{/(activityPage=${activities.page + 1}, activitySize=${activities.size},
                                   employeePage=${employees.page}, employeeSize=${employees.size})}">Next</a>
                </li>
            </ul>
        </nav>
        <p class="text-muted" th:text="${activities.totalElements} + ' activities total'"></p>
    </div>
</div>

<!-- Include Bootstrap JS and Popper.js -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
