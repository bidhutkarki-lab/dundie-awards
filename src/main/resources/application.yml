springdoc:
  api-docs:
    path: /openapi
server:
  port: 3000

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dundie}
    username: ${SPRING_DATASOURCE_USERNAME:dundie}
    password: ${SPRING_DATASOURCE_PASSWORD:dundie}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/static/
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0
