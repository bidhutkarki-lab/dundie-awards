services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dundie
      POSTGRES_USER: dundie
      POSTGRES_PASSWORD: dundie
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dundie -d dundie"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dundie
      SPRING_DATASOURCE_USERNAME: dundie
      SPRING_DATASOURCE_PASSWORD: dundie
    ports:
      - "3000:3000"

volumes:
  postgres-data:
